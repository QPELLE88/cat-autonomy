# CAT Autonomous Truck — Sensor Configuration
# LiDAR and obstacle detection parameters

lidar:
  primary_sensor:
    model: "Velodyne VLP-32C"
    mount_position: [0.0, 0.0, 3.5]  # meters from truck center
    rotation_rate_hz: 20
    range_max_m: 200
    vertical_fov_deg: 40
    horizontal_fov_deg: 360

  secondary_sensor:
    model: "Ouster OS1-128"
    mount_position: [4.5, 0.0, 2.8]
    rotation_rate_hz: 10
    range_max_m: 120
    vertical_fov_deg: 45
    horizontal_fov_deg: 360

obstacle_detection:
  pipeline:
    frame_rate_hz: 10
    clustering_method: "euclidean"
    min_cluster_points: 10
    max_cluster_distance_m: 0.5

  detectors:
    rock:
      enabled: true
      min_confidence: 0.85
      safety_buffer_m: 5.0
      response_action: "slow"
      profile:
        shape: "spherical"
        aspect_ratio_range: [0.6, 1.4]
        min_height_m: 0.3
        max_height_m: 3.0

    vehicle:
      enabled: true
      min_confidence: 0.85
      safety_buffer_m: 10.0
      response_action: "stop"
      profile:
        shape: "rectangular"
        aspect_ratio_range: [1.5, 4.0]
        min_height_m: 1.5
        max_height_m: 6.0
        min_length_m: 3.0

    personnel:
      enabled: true
      min_confidence: 0.85
      safety_buffer_m: 20.0
      response_action: "stop"
      profile:
        shape: "vertical_cylinder"
        aspect_ratio_range: [0.2, 0.6]
        min_height_m: 1.2
        max_height_m: 2.2
        max_width_m: 1.0

    # TODO: Add fallen_tree detector for forestry/construction expansion
    # Requirements from AV team:
    #   - Elongated horizontal profile detection
    #   - STOP response with 15m safety buffer
    #   - Must handle partial road blockage scenarios

safety:
  emergency_stop_distance_m: 5.0
  max_speed_near_obstacle_kmh: 10
  operator_alert_threshold_confidence: 0.7
